<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生命数字密码 · 生命蓝图解析</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="container">
        <header class="header">
          <p class="eyebrow">数字命理 · 生命蓝图</p>
          <h1>生命数字密码</h1>
          <p class="subtitle">基于毕达哥拉斯占数学</p>
          <div class="divider" aria-hidden="true"><span></span></div>
        </header>

        <section class="card input-card" aria-label="出生日期输入">
          <label class="field-label" for="year">输入你的出生日期</label>
          <div class="date-inputs">
            <input type="number" id="year" placeholder="年" min="1900" max="2099" inputmode="numeric" />
            <input type="number" id="month" placeholder="月" min="1" max="12" inputmode="numeric" />
            <input type="number" id="day" placeholder="日" min="1" max="31" inputmode="numeric" />
          </div>
          <button id="calcBtn" class="btn primary block" type="button">解 读 生 命 蓝 图</button>
        </section>

        <div id="results" class="results" aria-live="polite"></div>

        <footer class="footer">
          <p>仅供个人参考 · 生命密码解读</p>
        </footer>
      </div>
    </main>

    <!-- 生成中动画层 -->
    <section id="generateView" class="generate-view hidden" aria-live="polite" aria-label="生成报告进度">
      <div class="generate-card">
        <div class="analysis-core" aria-hidden="true">
          <div class="analysis-ring"></div>
          <div class="analysis-scan"></div>
          <div class="analysis-bars">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <p class="generate-eyebrow">生命蓝图生成中</p>
        <h2 id="generateStage">推演命理</h2>
        <p id="generateMessage" class="generate-message">正在汇集出生数字的能量…</p>
        <div class="generate-progress" aria-hidden="true"><div id="generateBar"></div></div>
        <div class="generate-meta">
          <span id="generatePercent">0%</span>
          <span id="generateTimer">0s</span>
        </div>
        <div class="generate-steps">
          <span data-stage="0" class="active">命数</span>
          <span data-stage="1">天赋</span>
          <span data-stage="2">九宫</span>
          <span data-stage="3">流年</span>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
